# nginx-level add_header inherits to a `location` block ONLY if that block has
# no add_header of its own (long-standing nginx gotcha). We therefore declare
# the security headers via a re-usable map+block trick: every location that
# adds *any* header repeats the security trio explicitly.

server {
    listen       8080 default_server;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Server-level defaults (apply to any location with NO add_header of its own)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /chunks/ {
        # No location-level add_header → server-level security headers inherit.
        # Cache-Control needs to be here; once added, security headers stop
        # inheriting, so we re-declare them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
    }
    location /static/ {
        # /static/ mixes content-hashed files with stable-name ones (favicon.ico,
        # blocks-media). Drop `immutable` — let mtime validation refresh on deploys.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public" always;
        expires 1y;
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    location = /env-config.js {
        # Rendered at container start by /docker-entrypoint.d/30-spark-env.sh
        # into /tmp/env-config.js. Keeps the html root mountable as readOnly.
        alias /tmp/env-config.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        default_type application/javascript;
    }

    location = /healthz {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Firmware update channel — served from MinIO (object storage) so firmware
    # updates never require an image rebuild. Proxied so the host stays unified
    # and works on both sparky.ntpsemi.com and sparky.zi-platform.com.
    # Security-header trio re-declared in every block (nginx add_header inheritance gotcha).
    location = /firmware/manifest.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        proxy_pass https://files.zicure.com/sparky-media/firmware/manifest.json;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
    location /firmware/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        proxy_pass https://files.zicure.com/sparky-media/firmware/;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # Download page (https://sparky.ntpsemi.com/releases/), mounted from the host like /firmware/. The page and
    # releases.json are revalidated on every visit; installers live under a per-version path and never change.
    location = /releases/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        proxy_pass https://files.zicure.com/sparky-media/releases/index.html;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
    location = /releases/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        proxy_pass https://files.zicure.com/sparky-media/releases/index.html;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
    location = /releases/releases.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        proxy_pass https://files.zicure.com/sparky-media/releases/releases.json;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }
    location /releases/files/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        default_type application/octet-stream;
        proxy_pass https://files.zicure.com/sparky-media/releases/files/;
        proxy_set_header Host files.zicure.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
