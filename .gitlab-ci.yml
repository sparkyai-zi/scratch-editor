# Sparky Scratch Editor — GitLab CI/CD
#
# Pipeline: build -> deploy
#   build  : docker build (npm ci + build ทั้ง monorepo ตาม Dockerfile) + push ไป Harbor
#   deploy : helm upgrade บน k8s production
#
# Registry: บังคับใช้ registry.zicure.com (Harbor, IP ตรง) — ห้ามใช้ registry
# ของ GitLab instance (อยู่หลัง Cloudflare → push image ใหญ่จะโดน 413)
#
# Variables ที่ตั้งใน Settings > CI/CD > Variables:
#   REGISTRY_USER / REGISTRY_PASSWORD  (masked) — account ของ registry.zicure.com
#   KUBE_CONFIG_PROD                  (regular/masked, ชนิด text) — kubeconfig prod

stages:
  - build
  - deploy

variables:
  REGISTRY: "registry.zicure.com/sparky-prod"
  IMAGE_NAME: "sparky-scratch-editor"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"
  DOCKER_TLS_CERTDIR: "/certs"

build:
  stage: build
  image: "docker:24-cli"
  services:
    - docker:24-dind
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin registry.zicure.com
  script:
    - docker build -t ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} .
    - docker push ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
    - docker tag ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY}/${IMAGE_NAME}:latest
    - docker push ${REGISTRY}/${IMAGE_NAME}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "sparky-on-fresh"
    - if: $CI_COMMIT_TAG

deploy:production:
  stage: deploy
  image: "dtzar/helm-kubectl:3.19"
  environment:
    name: production
    url: https://sparky.ntpsemi.com
  needs:
    - build
  before_script:
    - mkdir -p ~/.kube
    - |
      RAW="${KUBE_CONFIG_PROD:-$KUBE_CONFIG_STAGING}"
      if ! printf '%s' "$RAW" | grep -q 'apiVersion'; then
        DEC=$(printf '%s' "$RAW" | tr -d '\n' | base64 -d 2>/dev/null) || DEC=''
        [ -n "$DEC" ] && RAW="$DEC"
      fi
      printf '%b' "$RAW" | sed 's/\r$//' > ~/.kube/config
      kubectl config view --raw >/dev/null || { echo "kubeconfig invalid"; exit 1; }
  script:
    - |
      helm upgrade --install sparky kubernetes/ -n sparky \
        --reset-values \
        --set image.repository=${REGISTRY}/${IMAGE_NAME} \
        --set image.tag=${IMAGE_TAG} \
        --set replicaCount=3 \
        --wait --timeout 5m
    - kubectl -n sparky get pods,ingress
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "sparky-on-fresh"
    - if: $CI_COMMIT_TAG
